name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff mypy types-PyYAML
          python -m pip install "appinfra @ git+https://github.com/llm-works/appinfra.git@develop"
          # Install minimal deps for type checking (avoid heavy ML deps)
          python -m pip install sqlalchemy pydantic fastapi httpx
          # Install llm-infer and llm-saia from develop branch (policy: use @develop during
          # active development, pin to specific commit for releases)
          python -m pip install "llm-infer @ git+https://github.com/llm-works/llm-infer.git@develop" --no-deps
          python -m pip install "llm-saia @ git+https://github.com/llm-works/llm-saia.git@develop" --no-deps
          python -m pip install -e . --no-deps

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy llm_kelt/ --ignore-missing-imports

      - name: Check SPDX headers
        run: appinfra cq spdx

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: llm_kelt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up environment config
        run: cp .env.yaml.example .env.yaml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install runtime deps (avoid heavy ML deps from llm-infer)
          python -m pip install sqlalchemy psycopg2-binary pgvector alembic httpx fastapi uvicorn pydantic
          # Install appinfra from develop branch (policy: use @develop during active development,
          # pin to specific commit for releases)
          python -m pip install "appinfra[all] @ git+https://github.com/llm-works/appinfra.git@develop"
          # Install llm-infer and llm-saia from develop branch (policy: use @develop during
          # active development, pin to specific commit for releases)
          python -m pip install "llm-infer @ git+https://github.com/llm-works/llm-infer.git@develop" --no-deps
          python -m pip install "llm-saia @ git+https://github.com/llm-works/llm-saia.git@develop" --no-deps
          # Install dev deps explicitly
          python -m pip install pytest pytest-cov pytest-xdist pytest-asyncio coverage
          # Install package without transitive deps
          python -m pip install -e . --no-deps

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/llm_kelt_test
        run: python -m pytest tests/ -m "not llm and not training" -v --tb=short

  # Smoke test the PyPI-user path: build sdist+wheel with `python -m build`,
  # install into a fresh venv OUTSIDE the source tree (so imports resolve from
  # the wheel, not ./llm_kelt/), and exercise the surface a first-time user
  # hits — top-level imports, README quick-start against the installed wheel.
  # Complements `test` (source-tree editable install); this catches wheel-only
  # regressions (missing package data, broken exports, README-vs-installed
  # API drift).
  #
  # Matrix: 3.12 (baseline, matches lint/coverage) + 3.14 (newest supported).
  #
  # Sibling deps (appinfra/llm-infer/llm-saia) install with the same
  # @develop + --no-deps pattern used by lint/test/coverage — smoke does not
  # attempt strict "PyPI-only" resolution during active development.
  smoke-wheel:
    name: Smoke (wheel install) ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 8

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: llm_kelt_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm needs full history to derive version
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install build frontend
        run: python -m pip install --upgrade pip build

      - name: Build sdist + wheel
        run: python -m build

      - name: Install wheel into fresh venv (outside source tree)
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          # Install runtime deps (mirror lint/test): PyPI for non-sibling,
          # @develop for own siblings per repo policy.
          /tmp/smoke/bin/pip install sqlalchemy psycopg2-binary pgvector alembic httpx fastapi uvicorn pydantic
          /tmp/smoke/bin/pip install "appinfra[all] @ git+https://github.com/llm-works/appinfra.git@develop"
          /tmp/smoke/bin/pip install "llm-infer @ git+https://github.com/llm-works/llm-infer.git@develop" --no-deps
          /tmp/smoke/bin/pip install "llm-saia @ git+https://github.com/llm-works/llm-saia.git@develop" --no-deps
          # Install the built wheel with --no-deps: exercises the wheel
          # contents (imports, package-data, exports) without re-pulling deps.
          wheels=(./dist/*.whl)
          /tmp/smoke/bin/pip install --no-deps "${wheels[0]}"

      - name: Import + version from installed wheel
        run: |
          /tmp/smoke/bin/python - <<'PY'
          import llm_kelt
          from llm_kelt import ClientContext, ClientFactory
          from llm_kelt.inference import ContextBuilder
          print("llm_kelt", llm_kelt.__version__)
          print("ClientFactory =", ClientFactory)
          print("ContextBuilder =", ContextBuilder)
          PY

      - name: README quick-start against installed wheel
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/llm_kelt_smoke
        run: /tmp/smoke/bin/python examples/quickstart.py

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: llm_kelt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up environment config
        run: cp .env.yaml.example .env.yaml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install runtime deps (avoid heavy ML deps from llm-infer)
          python -m pip install sqlalchemy psycopg2-binary pgvector alembic httpx fastapi uvicorn pydantic
          # Install appinfra from develop branch (policy: use @develop during active development,
          # pin to specific commit for releases)
          python -m pip install "appinfra[all] @ git+https://github.com/llm-works/appinfra.git@develop"
          # Install llm-infer and llm-saia from develop branch (policy: use @develop during
          # active development, pin to specific commit for releases)
          python -m pip install "llm-infer @ git+https://github.com/llm-works/llm-infer.git@develop" --no-deps
          python -m pip install "llm-saia @ git+https://github.com/llm-works/llm-saia.git@develop" --no-deps
          # Install dev deps explicitly
          python -m pip install pytest pytest-cov pytest-xdist pytest-asyncio coverage
          # Install package without transitive deps
          python -m pip install -e . --no-deps

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/llm_kelt_test
        run: python -m pytest tests/ -m "not llm and not training" --cov=llm_kelt --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
