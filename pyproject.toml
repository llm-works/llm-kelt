[build-system]
requires = ["setuptools>=68.0", "wheel", "setuptools-scm>=8.0,<9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-kelt"
dynamic = ["version"]
description = "Framework for collecting and managing LLM context"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "LLM Works LLC", email = "info@llm-works.ai"}]
requires-python = ">=3.11"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # Core infrastructure
    "appinfra>=0.11.0",

    # Storage
    # SQLAlchemy 2.1 made ScalarAttributeImpl private, which breaks sqlalchemy-utils
    "sqlalchemy>=2.0,<2.1",
    "sqlalchemy-utils>=0.42,<1.0",
    "psycopg2-binary>=2.9,<3.0",
    "pgvector>=0.3,<1.0",
    "alembic>=1.12,<2.0",

    # Inference
    "llm-infer>=0.2.0,<1.0",
    "llm-saia>=0.5.0,<1.0",
    "httpx>=0.27,<1.0",

    # Serving
    "fastapi>=0.109,<1.0",
    "uvicorn>=0.27,<1.0",
]

[project.scripts]
llm-kelt = "llm_kelt.cli:main"

[project.optional-dependencies]
dev = [
    "coverage>=7.0.0,<8.0.0",
    "ruff>=0.1.0,<1.0.0",
    "mypy>=1.0.0,<2.0.0",
    "types-PyYAML>=6.0,<7.0",
    "pytest>=7.0.0,<10.0.0",
    "pytest-asyncio>=0.21,<2.0",
    "pytest-cov>=4.0.0,<8.0.0",
    "pytest-xdist>=3.0.0,<4.0.0",
]
training = [
    "torch>=2.13",
    "transformers>=5.18",
    "peft>=0.21",
    "trl>=1.14",
    "datasets>=5.0",
    "accelerate>=1.15",
    "bitsandbytes>=0.50",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["llm_kelt"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
plugins = ["pydantic.mypy"]
exclude = ["llm_kelt/examples/"]

# ML stack (the training extra): not analysed, its imports are Any. CI does not
# install it, and analysing torch/transformers ties the check to their annotations
# across our wide version ranges. Skipped the same way locally and in CI, so both
# give the same verdict. `.*` patterns match the package and its submodules.
[[tool.mypy.overrides]]
module = [
    "torch.*",
    "transformers.*",
    "peft.*",
    "trl.*",
    "datasets.*",
    "bitsandbytes.*",
    "safetensors.*",
    "numpy.*",
]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

# sqlalchemy_utils ships no types; its only stub package (types-sqlalchemy-utils)
# is built on the SQLAlchemy 1.4 stubs and does not fit SQLAlchemy 2.0.
[[tool.mypy.overrides]]
module = ["sqlalchemy_utils.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:'crypt' is deprecated:DeprecationWarning:passlib",
    "ignore:The argument 'device' of Tensor.pin_memory:DeprecationWarning",
    "ignore:The argument 'device' of Tensor.is_pinned:DeprecationWarning",
    "ignore:builtin type Swig.*has no __module__:DeprecationWarning",
]
markers = [
    "unit: marks tests as unit tests (fast, no external dependencies)",
    "integration: marks tests as integration tests (require database)",
    "e2e: marks tests as end-to-end tests (require full system)",
    "llm: marks tests as requiring a running LLM (deselect with '-m \"not llm\"')",
    "training: marks tests requiring training dependencies (torch, transformers, peft, trl)",
    "gpu: marks tests using the local GPU; its memory is released after each test",
]

[tool.coverage.run]
source = ["llm_kelt"]
omit = ["*/test/*", "*/tests/*", "*_test.py", "*/examples/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.setuptools.package-data]
llm_kelt = [
    "py.typed",
    "etc/*.yaml",
    "examples/*.py",
    "migrations/alembic.ini",
    "migrations/env.py",
    "migrations/script.py.mako",
    "migrations/versions/*.py",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_kelt*"]
exclude = ["tests*", "docs*"]

[tool.setuptools_scm]
fallback_version = "0.0.0.dev0"
